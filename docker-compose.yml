# All values come from .env (loaded automatically by Docker Compose).

x-common: &common
  restart: unless-stopped
  environment:
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}
    UMASK: ${UMASK}
  networks:
    - downloads

services:
  sabnzbd:
    <<: *common
    image: lscr.io/linuxserver/sabnzbd:${SABNZBD_TAG}
    container_name: sabnzbd
    volumes:
      - ${CONFIG_ROOT}/sabnzbd:/config
      - ${DATA_ROOT}:/data
    ports:
      - ${SABNZBD_PORT}:8080

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:${RADARR_TAG}
    container_name: radarr
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - ${RADARR_PORT}:7878
    depends_on:
      - sabnzbd

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:${SONARR_TAG}
    container_name: sonarr
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - ${SONARR_PORT}:8989
    depends_on:
      - sabnzbd

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_TAG}
    container_name: prowlarr
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - ${PROWLARR_PORT}:9696

  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:${BAZARR_TAG}
    container_name: bazarr
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      # Same path as inside Radarr/Sonarr, so no path mapping is needed
      - ${DATA_ROOT}/media:/data/media
    ports:
      - ${BAZARR_PORT}:6767
    depends_on:
      - radarr
      - sonarr

  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin:${JELLYFIN_TAG}
    container_name: jellyfin
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media
    ports:
      - ${JELLYFIN_PORT}:8096

  # Seerr isn't a linuxserver image: it ignores PUID/PGID and runs as UID 1000.
  seerr:
    image: ghcr.io/seerr-team/seerr:${SEERR_TAG}
    container_name: seerr
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      LOG_LEVEL: ${SEERR_LOG_LEVEL}
      PORT: 5055
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
    ports:
      - ${SEERR_PORT}:5055
    networks:
      - downloads
    depends_on:
      - jellyfin
      - radarr
      - sonarr

  # Syncs TRaSH Guides quality settings into Radarr/Sonarr on a schedule.
  # No web UI. Config: ${CONFIG_ROOT}/recyclarr/recyclarr.yml
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:${RECYCLARR_TAG}
    container_name: recyclarr
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      CRON_SCHEDULE: ${RECYCLARR_SCHEDULE}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
    volumes:
      - ${CONFIG_ROOT}/recyclarr:/config
    networks:
      - downloads
    depends_on:
      - radarr
      - sonarr

  # Uptime Kuma and Dozzle aren't linuxserver images and ignore PUID/PGID.
  # Both get read-only access to the Docker socket to see container status/logs.
  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_TAG}
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - ${UPTIME_KUMA_PORT}:3001
    networks:
      - downloads

  dozzle:
    image: amir20/dozzle:${DOZZLE_TAG}
    container_name: dozzle
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - ${DOZZLE_PORT}:8080
    networks:
      - downloads

networks:
  downloads:
    name: ${COMPOSE_PROJECT_NAME}
