# All values come from .env (loaded automatically by Docker Compose).

x-common: &common
  restart: unless-stopped
  environment:
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}
    UMASK: ${UMASK}
  networks:
    - downloads

services:
  sabnzbd:
    <<: *common
    image: lscr.io/linuxserver/sabnzbd:${SABNZBD_TAG}
    container_name: sabnzbd
    volumes:
      - ${CONFIG_ROOT}/sabnzbd:/config
      - ${DATA_ROOT}:/data
    ports:
      - ${SABNZBD_PORT}:8080

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:${RADARR_TAG}
    container_name: radarr
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - ${RADARR_PORT}:7878
    depends_on:
      - sabnzbd

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:${SONARR_TAG}
    container_name: sonarr
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - ${SONARR_PORT}:8989
    depends_on:
      - sabnzbd

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_TAG}
    container_name: prowlarr
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - ${PROWLARR_PORT}:9696

  # Uptime Kuma and Dozzle aren't linuxserver images and ignore PUID/PGID.
  # Both get read-only access to the Docker socket to see container status/logs.
  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_TAG}
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - ${UPTIME_KUMA_PORT}:3001
    networks:
      - downloads

  dozzle:
    image: amir20/dozzle:${DOZZLE_TAG}
    container_name: dozzle
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - ${DOZZLE_PORT}:8080
    networks:
      - downloads

networks:
  downloads:
    name: ${COMPOSE_PROJECT_NAME}
